
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta CNPJ</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Consulta CNPJ</h1>
      <p>Consulta de dados cadastrais de empresas</p>
    </header>

    <section class="painel">
      <label for="cnpj">CNPJ da empresa</label>
      <div class="pesquisa">
        <input id="cnpj" type="text"
          placeholder="00.000.000/0000-00"
          maxlength="18" inputmode="numeric">
        <button id="pesquisar" type="button">
          Pesquisar
        </button>
        <button id="limpar" type="button">
          Limpar
        </button>
      </div>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>

    <section id="resultado" class="painel" hidden>
      <h2>Dados cadastrais</h2>

      <div class="dados">
        <div>
          <label>Tipo de estabelecimento</label>
          <p id="tipo"></p>
        </div>
        <div>
          <label>Situação cadastral</label>
          <p id="situacao"></p>
        </div>
        <div>
          <label>Nome empresarial</label>
          <p id="razao"></p>
        </div>
        <div>
          <label>Nome fantasia</label>
          <p id="fantasia"></p>
        </div>
      </div>

      <h2>Atividades econômicas</h2>
      <div class="dados">
        <div>
          <label>CNAE principal</label>
          <p id="principal"></p>
        </div>
        <div>
          <label>CNAEs secundários</label>
          <ul id="secundarios"></ul>
        </div>
      </div>

      <h2>Endereço</h2>
      <div class="dados">
        <div><label>Logradouro</label><p id="logradouro"></p></div>
        <div><label>Número</label><p id="numero"></p></div>
        <div><label>Complemento</label><p id="complemento"></p></div>
        <div><label>CEP</label><p id="cep"></p></div>
        <div><label>Bairro / Distrito</label><p id="bairro"></p></div>
        <div><label>Município</label><p id="municipio"></p></div>
        <div><label>UF</label><p id="uf"></p></div>
      </div>
    </section>
  </main>
</body>
</html>
